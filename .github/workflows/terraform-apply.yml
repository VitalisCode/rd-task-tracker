name: Terraform Apply

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod

# Prevent two Terraform deployments from modifying
# the same environment at the same time.
concurrency:
  group: terraform-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # DEV
  # ============================================================

  terraform-dev:
    name: Terraform Apply - Dev

    if: |
      (github.event_name == 'push' && github.ref_name == 'develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')

    runs-on: ubuntu-latest

    environment:
      name: dev

    defaults:
      run:
        working-directory: terraform

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Terraform Format Check
      # --------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # ========================================================
      # PHASE 1 - AWS / EKS INFRASTRUCTURE
      # ========================================================

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="backend-dev.hcl" \
            -reconfigure

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Plan - EKS Bootstrap
      #
      # module.eks is the EKS module in main.tf.
      #
      # Terraform automatically includes dependencies required
      # by module.eks, such as VPC and IAM resources.
      # --------------------------------------------------------

      - name: Terraform Plan - EKS Bootstrap
        run: |
          terraform plan \
            -lock-timeout=5m \
            -target=module.eks \
            -var-file="envs/dev.tfvars" \
            -out=dev-eks.tfplan

      # --------------------------------------------------------
      # Terraform Apply - EKS Bootstrap
      # --------------------------------------------------------

      - name: Terraform Apply - EKS Bootstrap
        run: |
          terraform apply \
            -lock-timeout=5m \
            -auto-approve \
            dev-eks.tfplan

      # ========================================================
      # PHASE 2 - CONNECT TO EKS
      # ========================================================

      # --------------------------------------------------------
      # Get EKS cluster name
      # --------------------------------------------------------

      - name: Get EKS cluster name
        id: eks
        run: |
          EKS_CLUSTER_NAME=$(terraform output -raw cluster_name)

          echo "EKS cluster: $EKS_CLUSTER_NAME"
          echo "cluster_name=$EKS_CLUSTER_NAME" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Update EKS kubeconfig
      # --------------------------------------------------------

      - name: Update EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ steps.eks.outputs.cluster_name }}"

      # --------------------------------------------------------
      # Verify Kubernetes access
      # --------------------------------------------------------

      - name: Verify Kubernetes cluster
        run: |
          kubectl get nodes

      # ========================================================
      # PHASE 3 - FULL TERRAFORM CONFIGURATION
      # ========================================================

      # --------------------------------------------------------
      # Terraform Plan - Full Configuration
      #
      # EKS already exists and kubeconfig is now available.
      # Terraform can now safely process kubernetes.tf.
      # --------------------------------------------------------

      - name: Terraform Plan - Full Configuration
        run: |
          terraform plan \
            -lock-timeout=5m \
            -var-file="envs/dev.tfvars" \
            -out=dev.tfplan

      # --------------------------------------------------------
      # Terraform Apply - Full Configuration
      # --------------------------------------------------------

      - name: Terraform Apply - Full Configuration
        run: |
          terraform apply \
            -lock-timeout=5m \
            -auto-approve \
            dev.tfplan



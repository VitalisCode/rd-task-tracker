name: Terraform Apply

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # DEV
  # ============================================================

  terraform-dev:
    name: Terraform Apply - Dev

    if: |
      (github.event_name == 'push' && github.ref_name == 'develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')

    runs-on: ubuntu-latest

    environment:
      name: dev

    defaults:
      run:
        working-directory: terraform

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Terraform Format Check
      # --------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # ========================================================
      # PHASE 1 - AWS / EKS INFRASTRUCTURE
      # ========================================================

      # --------------------------------------------------------
      # Create temporary Terraform configuration
      #
      # kubernetes.tf is excluded because the EKS cluster
      # must exist before the Kubernetes provider can connect.
      # --------------------------------------------------------

      - name: Create Terraform bootstrap configuration
        run: |
          rm -rf ../terraform-bootstrap

          mkdir -p ../terraform-bootstrap

          for file in *.tf; do
            if [[ "$file" != "kubernetes.tf" ]]; then
              cp "$file" ../terraform-bootstrap/
            fi
          done

          cp -R modules ../terraform-bootstrap/
          cp -R env ../terraform-bootstrap/

      # --------------------------------------------------------
      # Terraform Init - Bootstrap
      # --------------------------------------------------------

      - name: Terraform Init - Bootstrap
        working-directory: terraform-bootstrap
        run: |
          terraform init \
            -backend-config="../terraform/backend-dev.hcl" \
            -reconfigure

      # --------------------------------------------------------
      # Terraform Validate - Bootstrap
      # --------------------------------------------------------

      - name: Terraform Validate - Bootstrap
        working-directory: terraform-bootstrap
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Plan - Bootstrap
      # --------------------------------------------------------

      - name: Terraform Plan - Bootstrap
        working-directory: terraform-bootstrap
        run: |
          terraform plan \
            -var-file="env/dev.tfvars" \
            -out=dev-bootstrap.tfplan

      # --------------------------------------------------------
      # Terraform Apply - Bootstrap
      # --------------------------------------------------------

      - name: Terraform Apply - Bootstrap
        working-directory: terraform-bootstrap
        run: |
          terraform apply \
            -auto-approve \
            dev-bootstrap.tfplan

      # ========================================================
      # PHASE 2 - CONNECT TO EKS
      # ========================================================

      # --------------------------------------------------------
      # Get EKS cluster name from Terraform output
      # --------------------------------------------------------

      - name: Get EKS cluster name
        id: eks
        working-directory: terraform-bootstrap
        run: |
            EKS_CLUSTER_NAME=$(terraform output -raw cluster_name)

            echo "EKS cluster: $EKS_CLUSTER_NAME"
            echo "cluster_name=$EKS_CLUSTER_NAME" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Update EKS kubeconfig
      # --------------------------------------------------------

      - name: Update EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ steps.eks.outputs.cluster_name }}"

      # --------------------------------------------------------
      # Verify Kubernetes access
      # --------------------------------------------------------

      - name: Verify Kubernetes cluster
        run: |
          kubectl get nodes

      # ========================================================
      # PHASE 3 - KUBERNETES RESOURCES
      # ========================================================

      # --------------------------------------------------------
      # Terraform Init - Full Configuration
      # --------------------------------------------------------

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="backend-dev.hcl" \
            -reconfigure

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Plan - Full Configuration
      # --------------------------------------------------------

      - name: Terraform Plan - Kubernetes
        run: |
          terraform plan \
            -var-file="env/dev.tfvars" \
            -out=dev-kubernetes.tfplan

      # --------------------------------------------------------
      # Terraform Apply - Full Configuration
      # --------------------------------------------------------

      - name: Terraform Apply - Kubernetes
        run: |
          terraform apply \
            -auto-approve \
            dev-kubernetes.tfplan



name: Terraform Apply

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # DEV
  # ============================================================

  terraform-dev:
    name: Terraform Apply - Dev

    if: |
      (github.event_name == 'push' && github.ref_name == 'develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')

    runs-on: ubuntu-latest

    environment:
      name: dev

    defaults:
      run:
        working-directory: terraform

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="backend-dev.hcl" \
            -reconfigure

      # --------------------------------------------------------
      # Terraform Format Check
      # --------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="env/dev.tfvars" \
            -out=dev.tfplan

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        run: |
          terraform apply \
            -auto-approve \
            dev.tfplan

      # --------------------------------------------------------
      # Get EKS cluster name from Terraform output
      # --------------------------------------------------------

      - name: Get EKS cluster name
        id: eks
        run: |
          EKS_CLUSTER_NAME=$(terraform output -raw eks_cluster_name)

          echo "EKS cluster: $EKS_CLUSTER_NAME"
          echo "cluster_name=$EKS_CLUSTER_NAME" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Update EKS kubeconfig
      # --------------------------------------------------------

      - name: Update EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ steps.eks.outputs.cluster_name }}"

      # --------------------------------------------------------
      # Verify Kubernetes access
      # --------------------------------------------------------

      - name: Verify Kubernetes cluster
        run: |
          kubectl get nodes

      # --------------------------------------------------------
      # Apply Terraform Kubernetes resources
      # --------------------------------------------------------

      - name: Apply Terraform Kubernetes resources
        run: |
          terraform plan \
            -var-file="env/dev.tfvars" \
            -out=dev-kubernetes.tfplan

          terraform apply \
            -auto-approve \
            dev-kubernetes.tfplan


